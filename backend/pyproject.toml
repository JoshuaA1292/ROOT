[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "root-backend"
version = "0.1.0"
description = "ROOT Urban Tree Intelligence Agent — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.4.0",
    "pymongo>=4.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "google-cloud-aiplatform>=1.57.0",
    "google-cloud-secret-manager>=2.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    "google-adk>=2.1.0",
    "mcp>=1.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
scripts = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
