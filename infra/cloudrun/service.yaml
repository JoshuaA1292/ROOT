apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: root-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - image: gcr.io/${PROJECT_ID}/root-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-uri
                  key: latest
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: CORS_ORIGINS
              value: ${VERCEL_URL},http://localhost:3000
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
      serviceAccountName: root-backend-sa
